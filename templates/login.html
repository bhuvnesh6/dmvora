<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMvora · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#2563eb;--grad:linear-gradient(135deg,#38bdf8 0%,#2563eb 55%,#1e3a8a 100%);--h:#0b1e3d;--b:#5c6b8a;--line:rgba(29,78,216,.12)}
body{font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--h);background:#eef3fb;
background-image:radial-gradient(900px 600px at 20% -10%,rgba(37,99,235,.28),transparent 65%),radial-gradient(700px 500px at 100% 100%,rgba(56,189,248,.2),transparent 60%)}
.card{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 24px 60px rgba(15,58,138,.14)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 20px 'Space Grotesk';box-shadow:0 8px 20px rgba(37,99,235,.35)}
.brand b{font:700 18px 'Space Grotesk'}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--b)}
.eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.18);padding:4px 11px;border-radius:99px;margin-bottom:10px}
h1{font:700 28px 'Space Grotesk';letter-spacing:-.4px}
p.sub{color:var(--b);font-size:13.5px;margin:6px 0 20px}
label{display:block;font-size:12px;font-weight:600;color:var(--b);margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f3f8ff;font:inherit;font-size:14px;color:var(--h);outline:none}
input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--grad);color:#fff;font:600 14px Inter;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.32)}
.btn:hover{opacity:.95}
.alert{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:6px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.22);color:#b91c1c}
.foot{margin-top:22px;text-align:center;font-size:13px;color:var(--b)}
.foot a{color:var(--accent);font-weight:600;text-decoration:none}
</style></head>
<body><main class="card">
<div class="brand"><span class="mark">D</span><div><b>DMvora</b><small>WHATSAPP BUSINESS DESK</small></div></div>
<span class="eyebrow">SIGN IN</span><h1>Welcome back.</h1>
<p class="sub">Admins, clients and team members all sign in here.</p>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="post" action="/login">
<label>Email, phone or admin username</label><input name="identifier" autocomplete="username" required placeholder="you@company.com">
<label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Your password">
<button class="btn">Sign in →</button></form>
<div class="foot">New business? <a href="/signup">Request an account</a></div>
</main></body></html>
