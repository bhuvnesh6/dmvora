<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMvora · Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-body"><main class="login-card">
<div class="brand"><span class="brand-mark">D</span><div><b>DMvora</b><small>WHATSAPP BUSINESS DESK</small></div></div>
<div class="login-intro"><span class="eyebrow">PRIVATE WORKSPACE</span><h1>Welcome back.</h1><p>Sign in to manage your WhatsApp business conversations.</p></div>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert error">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="post" action="/login" class="login-form">
<label>Username</label><input name="username" autocomplete="username" required placeholder="Admin username">
<label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Your password">
<button class="btn primary full">Sign in <span>→</span></button></form>
<div class="login-foot">Protected single-user workspace</div></main></body></html>
