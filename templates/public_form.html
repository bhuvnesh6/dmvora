<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ form.name }} · DMvora</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="public-form-body"><main class="public-form panel"><div class="brand"><span class="brand-mark">D</span><div><b>DMvora</b><small>QUICK FORM</small></div></div><span class="eyebrow">DETAILS</span><h1>{{ form.name }}</h1><p>Please complete the details below.</p><form method="post">{% for f in fields %}<label>{{ f.label }}{% if f.required %}<em> *</em>{% endif %}{% if f.type == 'textarea' %}<textarea name="{{ f.key or f.label }}" {% if f.required %}required{% endif %}></textarea>{% else %}<input name="{{ f.key or f.label }}" type="{{ f.type or 'text' }}" {% if f.required %}required{% endif %}>{% endif %}</label>{% endfor %}<input type="hidden" name="phone" value="{{ phone }}"><input type="hidden" name="number" value="{{ number_id }}"><button class="btn primary full">Submit details →</button></form></main></body></html>
